name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:api
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Verify production container serves the application
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag archguard/web:ci .
          docker run --detach --name archguard-web-ci \
            --add-host archguard-platform:127.0.0.1 \
            --add-host keycloak:127.0.0.1 \
            --publish 127.0.0.1:18080:8080 \
            archguard/web:ci
          trap 'docker rm --force archguard-web-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null \
              && curl --fail --silent --show-error 'http://127.0.0.1:18080/auth/callback?smoke=1' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs archguard-web-ci
          exit 1
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --verbose
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test -f LICENSE && grep -q "Apache License" LICENSE
