server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Global headers also cover client-side navigation into the credential page.
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  # Never spool a credential body to a proxy temporary file.
  location = /api/v1/agent/credentials/deepseek {
    client_max_body_size 512;
    client_body_buffer_size 1k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    proxy_pass http://archguard-platform:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location /api/ {
    proxy_pass http://archguard-platform:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location = /auth/callback {
    try_files /index.html =404;
  }
  location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri /index.html;
  }
}
